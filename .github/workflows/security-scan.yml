name: security-scan

# Seguridad en CI: escaneo de secretos, comprobaciones del repo y lint de shell.
# Reutilizable como ejemplo de pipeline seguro para tus propios proyectos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Semanal: detecta roturas por dependencias nuevas aunque no haya commits.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks v3 lee los commits del PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  repo-scan:
    name: Reglas del repo (secretos / iconos / nombres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: scan-repo.sh
        run: bash scripts/security/scan-repo.sh

  shellcheck:
    name: Lint de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck
      - name: Ejecutar shellcheck
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck --severity=warning

  powershell:
    name: PowerShell (sintaxis, PSScriptAnalyzer y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sintaxis
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { "::error file=$($_.FullName),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          # Los módulos de Ansible reciben la contraseña en claro de Ansible (no_log): esa regla no aplica.
          $r = Invoke-ScriptAnalyzer -Path ad-powershell -Recurse -Severity Error, ParseError `
                 -ExcludeRule PSAvoidUsingConvertToSecureStringWithPlainText
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Pruebas con AD simulado
        shell: pwsh
        run: ./ad-powershell/tests/run.ps1
